name: Deploy Damien's Smoky Kitchen

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/damiens-smoky-kitchen/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: damien-smoky-kitchen-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build, and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run chatbot tests
        working-directory: artifacts/damiens-smoky-kitchen
        run: pnpm test

      - name: Type-check chatbot
        working-directory: artifacts/damiens-smoky-kitchen
        run: pnpm typecheck

      - name: Build production assets
        working-directory: artifacts/damiens-smoky-kitchen
        run: pnpm build

      - name: Apply pending production D1 migrations
        working-directory: artifacts/damiens-smoky-kitchen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "56b8950a841afabf4667e40c739a1048"
        run: pnpm exec wrangler d1 migrations apply damien-smoky-kitchen-orders-eu --remote --config wrangler.jsonc

      - name: Deploy to Cloudflare Workers
        working-directory: artifacts/damiens-smoky-kitchen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "56b8950a841afabf4667e40c739a1048"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_DEPLOY_TOKEN"
            exit 1
          fi
          pnpm exec wrangler deploy --config wrangler.jsonc
