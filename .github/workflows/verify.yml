name: Verify

on:
  push:
    branches:
      - main
      - codex/worker-architecture-upgrade
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/damiens-smoky-kitchen test
      - run: pnpm run build
      - run: pnpm --filter @workspace/damiens-smoky-kitchen exec wrangler deploy --dry-run
