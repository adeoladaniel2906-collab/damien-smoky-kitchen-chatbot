name: Refresh security lockfile

on:
  push:
    branches:
      - codex/worker-architecture-upgrade
    paths:
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/worker-architecture-upgrade
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile from active workspace packages
        run: pnpm install --lockfile-only
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate
      - name: Typecheck
        run: pnpm run typecheck
      - name: Run chatbot and authentication tests
        run: pnpm --filter @workspace/damiens-smoky-kitchen test
      - name: Build production assets
        run: pnpm run build
      - name: Validate production Worker bundle
        working-directory: artifacts/damiens-smoky-kitchen
        run: pnpm exec wrangler deploy --dry-run
      - name: Validate preview Worker bundle
        working-directory: artifacts/damiens-smoky-kitchen
        run: pnpm exec wrangler deploy --dry-run --config wrangler.preview.jsonc
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: refresh lockfile with patched dependencies"
          git push origin HEAD:codex/worker-architecture-upgrade
