<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Damien&#39;s Smoky Kitchen</title>
    <meta name="theme-color" content="#21382d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Damien's Kitchen" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="description" content="Damien&#39;s Smoky Kitchen — smoky Nigerian food, drinks, and warm hospitality." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Damien&#39;s Smoky Kitchen" />
    <meta property="og:description" content="Damien&#39;s Smoky Kitchen — smoky Nigerian food, drinks, and warm hospitality." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Damien&#39;s Smoky Kitchen" />
    <meta name="twitter:description" content="Damien&#39;s Smoky Kitchen — smoky Nigerian food, drinks, and warm hospitality." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <main role="status" aria-live="polite" aria-busy="true" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8f4;color:#21382d;font-family:Inter,system-ui,sans-serif">
        <section style="width:min(100%,760px);padding:28px;border:1px solid #eee8dc;border-radius:28px;background:#fff;box-shadow:0 12px 36px rgba(33,56,45,.06)">
          <div style="display:flex;align-items:center;gap:12px">
            <span style="display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#21382d;color:#fff;font-size:24px;font-weight:800">D</span>
            <div><strong style="display:block;font-size:15px">Damien's Smoky Kitchen</strong><span style="font-size:12px;color:#69766e">Fresh Nigerian favourites</span></div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:28px;align-items:center">
            <div><div style="height:10px;width:90px;border-radius:10px;background:#eee8dc"></div><div style="height:30px;max-width:320px;margin-top:14px;border-radius:10px;background:#eee8dc"></div><div style="height:10px;max-width:280px;margin-top:12px;border-radius:10px;background:#f0ece2"></div><div style="height:10px;max-width:220px;margin-top:9px;border-radius:10px;background:#f0ece2"></div></div>
            <div style="height:150px;border-radius:18px;background:#f0ece2"></div>
          </div>
          <p style="margin:22px 0 0;text-align:center;font-size:13px;color:#69766e">Getting the kitchen ready…</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
