<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Damien's Smoky Kitchen</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Damien's Smoky Kitchen</h1>
    <p>Authentic Nigerian flavours, prepared with fire and tradition.</p>
  </header>

  <main>
    <section class="chat-container">

      <div class="chat-header">
        <h2>Damien's AI Assistant</h2>
        <span>● Online</span>
      </div>

      <div id="chat-box" class="chat-box">
        <div class="bot-message">
          Hello 👋 Welcome to Damien's Smoky Kitchen!
          <br><br>
          I can help you explore our menu, recommend meals,
          answer questions, or help you order.
          <br><br>
          What can I help you with today?
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="user-input"
          placeholder="Ask about our food..."
        >
        <button onclick="sendMessage()">Send</button>
      </div>

    </section>
  </main>

  <script src="script.js"></script>

</body>
</html>
